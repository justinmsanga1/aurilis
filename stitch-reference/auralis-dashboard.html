<style>

<script>
        // Micro-interaction for bento cards
        document.querySelectorAll('.bento-container > div').forEach(card => {
            card.addEventListener('touchstart', () => {
                card.style.transform = 'scale(0.98)';
                card.style.transition = 'transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)';
            });
            card.addEventListener('touchend', () => {
                card.style.transform = 'scale(1)';
            });
        });

        // Simple vertical sparkline animation simulation
        setInterval(() => {
            const sparkline = document.querySelector('.sparkline-vertical');
            if (sparkline) {
                const randomHeight = Math.floor(Math.random() * 40) + 40; // 40% to 80%
                sparkline.style.height = randomHeight + '%';
                sparkline.style.transition = 'height 2s ease-in-out';
            }
        }, 3000);
    </script>
